name: Build Beg Zheki

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: BegZheki

          options:
            bundleIdPrefix: com.begzheki
            deploymentTarget:
              iOS: "17.0"

          targets:
            BegZheki:
              type: application
              platform: iOS

              sources:
                - ContentView.swift
                - LocationManager.swift
                - RunManager.swift
                - RunSession.swift
                - VoiceCoach.swift
                - Бег ЖекиApp.swift

              info:
                path: Info.plist

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.begzheki.app
                  PRODUCT_NAME: BegZheki
                  SWIFT_VERSION: "5.0"
                  INFOPLIST_FILE: Info.plist
          EOF

          xcodegen generate

      - name: Build iPhone device version
        run: |
          xcodebuild \
            -project "BegZheki.xcodeproj" \
            -scheme "BegZheki" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Configure app for iPhone and SideStore
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BegZheki.app"
          PLIST="$APP_PATH/Info.plist"

          echo "Настройка Info.plist..."

          # Удаляем старые значения, если они существуют
          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleDisplayName" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleName" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationWhenInUseUsageDescription" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocationAlwaysUsageDescription" \
            "$PLIST" || true

          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$PLIST" || true

          # Техническое имя приложения — только латиница
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string BegZheki" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string BegZheki" \
            "$PLIST"

          # Разрешение на использование GPS
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string Приложению нужен доступ к геопозиции для отслеживания маршрута пробежки." \
            "$PLIST"

          # Разрешение на GPS в фоне
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Приложению нужен доступ к геопозиции в фоновом режиме для продолжения отслеживания пробежки." \
            "$PLIST"

          # Совместимость со старыми версиями iOS
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysUsageDescription string Приложению нужен доступ к геопозиции для отслеживания маршрута пробежки." \
            "$PLIST"

          # Работа GPS и голосового тренера в фоне
          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string location" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:1 string audio" \
            "$PLIST"

          # Русское название приложения
          mkdir -p "$APP_PATH/ru.lproj"

          cat > "$APP_PATH/ru.lproj/InfoPlist.strings" <<'EOF'
          "CFBundleDisplayName" = "Бег Жеки";
          EOF

          echo ""
          echo "===== ПРОВЕРКА ПРИЛОЖЕНИЯ ====="

          echo "Имя:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST"

          echo "Bundle:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo "GPS:"
          /usr/libexec/PlistBuddy \
            -c "Print :NSLocationWhenInUseUsageDescription" \
            "$PLIST"

          echo "Фоновая работа:"
          /usr/libexec/PlistBuddy \
            -c "Print :UIBackgroundModes" \
            "$PLIST"

          echo "================================"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/BegZheki.app" \
            Payload/

          zip -r "Бег-Жеки-unsigned.ipa" Payload

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beg-Zheki-IPA
          path: Бег-Жеки-unsigned.ipa
