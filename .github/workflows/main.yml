name: Build Beg Zheki

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: BegZheki

          options:
            bundleIdPrefix: com.begzheki
            deploymentTarget:
              iOS: "17.0"

          targets:
            BegZheki:
              type: application
              platform: iOS
              sources:
                - ContentView.swift
                - LocationManager.swift
                - RunManager.swift
                - RunSession.swift
                - VoiceCoach.swift
                - Бег ЖекиApp.swift
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.begzheki.app
                  PRODUCT_NAME: BegZheki
                  SWIFT_VERSION: "5.0"
                  INFOPLIST_FILE: Info.plist
          EOF

          xcodegen generate

      - name: Build iPhone device version
        run: |
          xcodebuild \
            -project "BegZheki.xcodeproj" \
            -scheme "BegZheki" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

     
      - name: Fix app name for SideStore
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/BegZheki.app"
          PLIST="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string BegZheki" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string BegZheki" \
            "$PLIST"

          mkdir -p "$APP_PATH/ru.lproj"

          cat > "$APP_PATH/ru.lproj/InfoPlist.strings" <<'EOF'
          "CFBundleDisplayName" = "Бег Жеки";
          EOF

          echo "Проверка:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleName" \
            "$PLIST"
          mkdir -p "$APP_PATH/ru.lproj"

          cat > "$APP_PATH/ru.lproj/InfoPlist.strings" <<'EOF'
          "CFBundleDisplayName" = "Бег Жеки";
          EOF

          echo "Проверка имени приложения:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleName" \
            "$APP_PATH/Info.plist"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/BegZheki.app" \
            Payload/

          zip -r "Бег-Жеки-unsigned.ipa" Payload

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beg-Zheki-IPA
          path: Бег-Жеки-unsigned.ipa


